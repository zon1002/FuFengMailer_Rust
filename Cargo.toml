[package]
name = "fufeng_mailer"
version = "3.0.0"
edition = "2024"
description = "福豐薪資單批量寄送工具（Rust / egui 版）"
build = "build.rs"

[[bin]]
name = "FuFengMailer"
path = "src/main.rs"

[lib]
name = "fufeng_mailer"
path = "src/lib.rs"

[dependencies]
eframe = "0.36"
egui_extras = "0.36"
calamine = "0.36"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "pool", "hostname"] }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Globalization",
] }

[dev-dependencies]
rust_xlsxwriter = "0.100"
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
